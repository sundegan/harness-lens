[package]
name = "harness-lens"
version = "0.1.0"
description = "Requirement-level analytics for evolving AI coding harnesses"
authors = ["degan.sun"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "harness_lens_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = []
e2e = ["dep:tauri-plugin-wdio-webdriver"]

[build-dependencies]
tauri-build = { version = "=2.5.5", features = [] }

[dependencies]
tauri = { version = "=2.10.2", features = ["image-png", "macos-private-api", "tray-icon"] }
tauri-plugin-opener = "=2.5.0"
tauri-plugin-single-instance = "=2.4.2"
tauri-plugin-updater = "=2.9.0"
tauri-plugin-wdio = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5.0"
log = "0.4"
include_dir = "0.7.4"
rusqlite = { version = "0.40.1", features = ["backup", "bundled"] }
rusqlite_migration = { version = "2.6.0", features = ["from-directory"] }
tauri-plugin-log = "=2.8.0"
tauri-plugin-wdio-webdriver = { version = "1", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
dispatch2 = "0.3"
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "NSAppearance",
    "NSButton",
    "NSColor",
    "NSControl",
    "NSResponder",
    "NSView",
    "NSWindow",
] }
