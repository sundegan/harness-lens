name: Greetings

on: [pull_request_target, issues]

jobs:
  greeting:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
    - uses: actions/first-interaction@v1
      with:
        repo-token: ${{ secrets.GITHUB_TOKEN }}
        issue-message: "Welcome to HarnessLens! Thanks for opening your first issue. Whether it is a bug report, a feature idea, or general feedback, we appreciate you taking the time to share it. If it helps, feel free to include any relevant details — reproduction steps, expected vs actual behavior, logs, screenshots, or just your thoughts. Whatever you have is welcome."
        pr-message: "Welcome to HarnessLens! Thanks for your first pull request. Please ensure your PR title follows the Conventional Commits format (e.g. feat:, fix:, docs:, refactor:) and that `pnpm lint` and `cargo clippy` pass locally."
