name: CI & Release Build

on:
  push:
    branches:
      - '**' # Trigger on every commit push to any branch
    tags:
      - 'v*' # Trigger on version tags (e.g., v0.1.0)
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # 1. Quality Control: Lint & Static Analysis
  lint-and-check:
    name: Lint & Static Checks
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Install Linux Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install Node Dependencies
        run: pnpm install --frozen-lockfile

      - name: Frontend Svelte Check
        run: pnpm run check

      - name: Backend Rust Clippy Lint
        run: cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings

  # 2. Testing: JS & Rust Unit Tests
  test:
    name: Unit & E2E Tests
    runs-on: ubuntu-22.04
    needs: lint-and-check
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install Node Dependencies
        run: pnpm install --frozen-lockfile

      - name: Frontend JavaScript Unit Tests
        run: pnpm test

      - name: Backend Rust Unit Tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --all-features

      - name: End-to-End Tests Placeholder
        run: |
          echo "=== End-to-End Tests Placeholder ==="
          echo "E2E test suite not yet configured. Leaving space for integration tests (e.g. Playwright or tauri-driver)."
          echo "====================================="

  # 3. Multi-platform Build & Release
  build-and-release:
    name: Build & Release
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            os: macOS
          - platform: windows-latest
            os: Windows
          - platform: ubuntu-22.04
            os: Linux
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install Linux Dependencies (Ubuntu Only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev

      - name: Install Node Dependencies
        run: pnpm install --frozen-lockfile

      # Step A: Build and Publish Tauri Bundles (Only executed for version tag pushes)
      - name: Build and Publish Tauri Bundles (Release)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: tauri-apps/tauri-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          tagName: v__VERSION__ # e.g. v0.1.0 (replaces with tauri.conf.json version)
          releaseName: 'v__VERSION__'
          releaseDraft: true
          prerelease: false

      # Step B: Build Tauri Bundles (Executed for normal pushes/pull-requests to compile and test the build)
      - name: Build Tauri Bundles (Validation Only)
        if: "!startsWith(github.ref, 'refs/tags/v')"
        uses: tauri-apps/tauri-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}

      # Step C: Upload compiled artifacts to Actions Run (Only for validation builds)
      - name: Upload Build Artifacts (Validation Only)
        if: "!startsWith(github.ref, 'refs/tags/v')"
        uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.os }}
          path: |
            src-tauri/target/release/bundle/**/*.dmg
            src-tauri/target/release/bundle/**/*.msi
            src-tauri/target/release/bundle/**/*.nsis
            src-tauri/target/release/bundle/**/*.deb
            src-tauri/target/release/bundle/**/*.AppImage
            src-tauri/target/release/bundle/**/*.zip
            src-tauri/target/release/bundle/**/*.tar.gz
          if-no-files-found: warn
