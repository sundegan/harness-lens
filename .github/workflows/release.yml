name: Release

on:
  push:
    tags:
      - 'v*' # Only version tags (e.g., v0.1.0)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build & Release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            os: macOS
          - platform: windows-latest
            os: Windows
          - platform: ubuntu-22.04
            os: Linux
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.13.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - name: Install Linux Dependencies (Ubuntu Only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Frontend Build
        run: pnpm build

      - name: Build and Publish Tauri Bundles
        uses: tauri-apps/tauri-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          tagName: v__VERSION__ # e.g. v0.1.0 (replaces with tauri.conf.json version)
          releaseName: 'v__VERSION__'
          releaseDraft: true
          prerelease: false
