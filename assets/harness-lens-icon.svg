<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" fill="none">
  <title>HarnessLens</title>
  <desc>A simple magnifying glass for inspecting AI coding harnesses.</desc>
  <defs>
    <linearGradient id="surface" x1="54" y1="38" x2="446" y2="482" gradientUnits="userSpaceOnUse">
      <stop stop-color="#263545"/>
      <stop offset="0.46" stop-color="#111B29"/>
      <stop offset="1" stop-color="#080E18"/>
    </linearGradient>
    <radialGradient id="glass" cx="0" cy="0" r="1" gradientTransform="translate(194 133) rotate(54.2) scale(252)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1D5160" stop-opacity="0.52"/>
      <stop offset="0.5" stop-color="#143443" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#07141F" stop-opacity="0.78"/>
    </radialGradient>
    <linearGradient id="lens-ring" x1="119" y1="99" x2="326" y2="326" gradientUnits="userSpaceOnUse">
      <stop stop-color="#67E8F9"/>
      <stop offset="0.42" stop-color="#E0F2FE"/>
      <stop offset="0.72" stop-color="#A7F3D0"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="handle" x1="302" y1="296" x2="389" y2="388" gradientUnits="userSpaceOnUse">
      <stop stop-color="#E0F2FE"/>
      <stop offset="0.48" stop-color="#67E8F9"/>
      <stop offset="1" stop-color="#0EA5E9"/>
    </linearGradient>
    <linearGradient id="bar-green" x1="153" y1="233" x2="183" y2="280" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6EE7B7"/>
      <stop offset="1" stop-color="#10B981"/>
    </linearGradient>
    <linearGradient id="bar-cyan" x1="198" y1="198" x2="228" y2="280" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A5F3FC"/>
      <stop offset="1" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="bar-amber" x1="243" y1="153" x2="273" y2="280" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FDE68A"/>
      <stop offset="1" stop-color="#F59E0B"/>
    </linearGradient>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="150%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="14" stdDeviation="13" flood-color="#000000" flood-opacity="0.42"/>
    </filter>
    <clipPath id="surface-clip">
      <rect x="20" y="20" width="472" height="472" rx="104"/>
    </clipPath>
  </defs>

  <g transform="translate(30.37 30.37) scale(0.88136)">
  <g filter="url(#shadow)">
    <rect x="20" y="20" width="472" height="472" rx="104" fill="url(#surface)"/>
    <rect x="22" y="22" width="468" height="468" rx="102" stroke="#64748B" stroke-opacity="0.42" stroke-width="3"/>
    <rect x="31" y="31" width="450" height="450" rx="94" stroke="#E2E8F0" stroke-opacity="0.1" stroke-width="2"/>
  </g>

  <g clip-path="url(#surface-clip)">
    <path d="M20 121C143 48 321 39 492 105V20H20V121Z" fill="#94A3B8" fill-opacity="0.06"/>
    <path d="M38 415C164 459 338 458 493 384V492H20V425C26 421 32 418 38 415Z" fill="#020617" fill-opacity="0.18"/>
  </g>

  <circle cx="220" cy="207" r="124" fill="#22D3EE" fill-opacity="0.07"/>
  <circle cx="220" cy="207" r="119" fill="url(#glass)" stroke="url(#lens-ring)" stroke-width="14"/>
  <circle cx="220" cy="207" r="105" stroke="#E0F2FE" stroke-opacity="0.2" stroke-width="2"/>

  <g>
    <path d="M145 280H290" stroke="#E0F2FE" stroke-opacity="0.28" stroke-width="5" stroke-linecap="round"/>
    <rect x="153" y="233" width="30" height="47" rx="12" fill="url(#bar-green)"/>
    <rect x="198" y="198" width="30" height="82" rx="12" fill="url(#bar-cyan)"/>
    <rect x="243" y="153" width="30" height="127" rx="12" fill="url(#bar-amber)"/>
  </g>

  <path d="M307 294L381 368" stroke="#07131D" stroke-opacity="0.78" stroke-width="30" stroke-linecap="round"/>
  <path d="M307 294L381 368" stroke="url(#handle)" stroke-width="17" stroke-linecap="round"/>
  <path d="M377 365L391 379" stroke="#67E8F9" stroke-width="19" stroke-linecap="round"/>
  </g>
</svg>
